name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check Web and documentation assets
        run: |
          for file in webui/static/*.js; do
            node --input-type=module --check < "$file"
          done
          for file in docs/*.js; do
            node --check "$file"
          done
          python3 scripts/check_static_site.py

      - name: Test
        run: uv run pytest -q

      - name: Build distributions
        run: uv run python -m build

      - name: Check installed wheel
        run: bash scripts/check_wheel.sh
